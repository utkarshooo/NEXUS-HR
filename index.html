    const use3DTilt = () => {
      const handlePointerMove = (e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -10; // max 10 deg
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
      };

      const handlePointerLeave = (e) => {
        const card = e.currentTarget;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return {
        onMouseMove: handlePointerMove,
        onMouseLeave: handlePointerLeave,
        onTouchMove: handlePointerMove,
        onTouchEnd: handlePointerLeave,
      };

    // --- THREE.JS INTERACTIVE 3D SPATIAL WORKFORCE MESH ---
    function Spatial3DWorkforceMesh({ employees, onSelectEmployee, onClose }) {
      const mountRef = useRef(null);
      const [hoveredEmp, setHoveredEmp] = useState(null);

      useEffect(() => {
        if (!mountRef.current || typeof THREE === 'undefined') return;

        const container = mountRef.current;
        const width = container.clientWidth;
        const height = container.clientHeight;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070B12, 0.002);

        const camera = new THREE.PerspectiveCamera(55, width / height, 1, 2000);
        camera.position.set(0, 50, 340);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Ambient & Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x6366f1, 2, 800);
        pointLight.position.set(0, 100, 150);
        scene.add(pointLight);

        // Root 3D Mesh Group
        const meshGroup = new THREE.Group();
        scene.add(meshGroup);

        // Orbital Wireframe Sphere
        const sphereGeo = new THREE.SphereGeometry(180, 24, 24);
        const sphereMat = new THREE.MeshBasicMaterial({
          color: 0x312e81,
          wireframe: true,
          transparent: true,
          opacity: 0.12,
        });
        const wireframeSphere = new THREE.Mesh(sphereGeo, sphereMat);
        meshGroup.add(wireframeSphere);

        // Orbiting Rings
        const ringGeo = new THREE.RingGeometry(175, 178, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x4f46e5,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.25,
        });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 2.5;
        meshGroup.add(ring1);

        // Node Meshes & Links
        const nodeObjects = [];
        const nodeGeometry = new THREE.SphereGeometry(7, 24, 24);

        employees.forEach((emp, i) => {
          let nodeColor = 0x6366f1;
          if (emp.flightRisk.score > 60) nodeColor = 0xf43f5e; // Rose (High Risk)
          else if (emp.flightRisk.score > 30) nodeColor = 0xf59e0b; // Amber (Medium)
          else nodeColor = 0x10b981; // Emerald (Low)

          const nodeMaterial = new THREE.MeshStandardMaterial({
            color: nodeColor,
            emissive: nodeColor,
            emissiveIntensity: 0.6,
            roughness: 0.3,
            metalness: 0.8,
          });

          const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
          const pos = emp.coordinates3D || { x: (i - 4) * 40, y: Math.sin(i) * 50, z: Math.cos(i) * 60 };
          node.position.set(pos.x, pos.y, pos.z);
          node.userData = { employee: emp };

          // Glow Halo
          const haloGeo = new THREE.SphereGeometry(11, 16, 16);
          const haloMat = new THREE.MeshBasicMaterial({
            color: nodeColor,
            transparent: true,
            opacity: 0.2,
            wireframe: true,
          });
          const halo = new THREE.Mesh(haloGeo, haloMat);
          node.add(halo);

          meshGroup.add(node);
          nodeObjects.push(node);
        });

        // Connection Lines Between Nodes
        const lineMat = new THREE.LineBasicMaterial({
          color: 0x818cf8,
          transparent: true,
          opacity: 0.28,
        });

        for (let i = 0; i < nodeObjects.length; i++) {
          for (let j = i + 1; j < nodeObjects.length; j++) {
            const dist = nodeObjects[i].position.distanceTo(nodeObjects[j].position);
            if (dist < 180) {
              const lineGeo = new THREE.BufferGeometry().setFromPoints([
                nodeObjects[i].position,
                nodeObjects[j].position,
              ]);
              const line = new THREE.Line(lineGeo, lineMat);
              meshGroup.add(line);
            }
          }
        }

        // Raycasting for Touch & Mouse Selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-999, -999);

        // Smooth Touch / Pointer Dragging Inertia Controls
        let isDragging = false;
        let prevPointerX = 0;
        let prevPointerY = 0;
        let velocityX = 0;
        let velocityY = 0;

        const onPointerDown = (e) => {
          isDragging = true;
          const x = e.touches ? e.touches[0].clientX : e.clientX;
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          prevPointerX = x;
          prevPointerY = y;
          velocityX = 0;
          velocityY = 0;
        };

        const onPointerMove = (e) => {
          const rect = container.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          mouse.x = ((clientX - rect.left) / width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / height) * 2 + 1;

          if (isDragging) {
            const deltaX = clientX - prevPointerX;
            const deltaY = clientY - prevPointerY;
            velocityX = deltaX * 0.005;
            velocityY = deltaY * 0.005;
            meshGroup.rotation.y += velocityX;
            meshGroup.rotation.x += velocityY;
            prevPointerX = clientX;
            prevPointerY = clientY;
          }
        };

        const onPointerUp = () => {
          isDragging = false;
        };

        const onClick = () => {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(nodeObjects, false);
          if (intersects.length > 0) {
            const emp = intersects[0].object.userData.employee;
            if (emp) onSelectEmployee(emp);
          }
        };

        container.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        container.addEventListener('click', onClick);

        container.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        // Animation Loop with Smooth Damping
        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          // Apply inertial velocity damping
          if (!isDragging) {
            velocityX *= 0.94;
            velocityY *= 0.94;
            meshGroup.rotation.y += velocityX + 0.0018; // ambient spin
            meshGroup.rotation.x += velocityY;
          }

          ring1.rotation.z += 0.004;

          // Check Hover Raycast
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(nodeObjects, false);
          if (intersects.length > 0) {
            const emp = intersects[0].object.userData.employee;
            setHoveredEmp(emp);
            container.style.cursor = 'pointer';
          } else {
            setHoveredEmp(null);
            container.style.cursor = 'grab';
          }

          renderer.render(scene, camera);
        };
        animate();

        // Resize Listener
        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousedown', onPointerDown);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          container.removeEventListener('click', onClick);
          container.removeEventListener('touchstart', onPointerDown);
          window.removeEventListener('touchmove', onPointerMove);
          window.removeEventListener('touchend', onPointerUp);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [employees]);

        let height = (canvas.height = window.innerHeight);

        const particles = Array.from({ length: 65 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 2 + 1,
          color: Math.random() > 0.5 ? 'rgba(99, 102, 241,' : 'rgba(6, 182, 212,',
          alpha: Math.random() * 0.5 + 0.2,
        }));

        let animId;
        const render = () => {
          animId = requestAnimationFrame(render);
          ctx.clearRect(0, 0, width, height);

          // Update & draw particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.color} ${p.alpha})`;
            ctx.fill();

            // Connect neighboring particles with silky lines
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(99, 102, 241, ${(1 - dist / 120) * 0.15})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }
        };
        render();

                    <span className="font-mono text-white">${Math.round(payslipEmployee.salary.baseAnnual / 12).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between text-rose-300">
                    <span>Tax & PF Deductions (28%)</span>
                    <span className="font-mono">-${Math.round(payslipEmployee.salary.baseAnnual / 12 * 0.28).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between pt-2 border-t border-slate-800 text-sm font-bold text-emerald-400">
                    <span>Net Disbursed</span>
                    <span className="font-mono">${Math.round(payslipEmployee.salary.baseAnnual / 12 * 0.72).toLocaleString()}</span>
                  </div>
                </div>
                <div className="pt-4 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold flex items-center space-x-1.5"
                  >
                    <Icon name="Printer" size={14} />
                    <span>Print Stub</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: EMPLOYEE PROFILE */}
          {selectedEmployee && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#111827] border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl relative animate-in fade-in zoom-in-95">
                <button
                  onClick={() => setSelectedEmployee(null)}
                  className="absolute top-5 right-5 p-2 rounded-xl bg-slate-800 text-slate-300"
                >
                  <Icon name="X" size={18} />
                </button>
                <div className="flex items-center space-x-4 pb-4 border-b border-slate-800">
                  <img src={selectedEmployee.avatar} className="w-16 h-16 rounded-2xl object-cover border-2 border-brand-500" />
                  <div>
                    <h3 className="text-lg font-bold text-white">{selectedEmployee.firstName} {selectedEmployee.lastName}</h3>
                    <p className="text-xs text-brand-300">{selectedEmployee.designation}</p>
                    <span className={`text-[10px] font-mono font-bold ${selectedEmployee.flightRisk.score > 60 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      Flight Risk: {selectedEmployee.flightRisk.score}% ({selectedEmployee.flightRisk.level})
                    </span>
                  </div>
                </div>
                <div className="py-4 space-y-2 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Department</span>
                    <span className="text-white font-medium">{selectedEmployee.department}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Reports To</span>
                    <span className="text-white font-medium">{selectedEmployee.managerName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Work Modality</span>
                    <span className="text-white font-medium">{selectedEmployee.workMode}</span>
                  </div>
                  <div className="pt-2">
                    <span className="text-slate-400 block mb-1.5">Core Competencies</span>
                    <div className="flex flex-wrap gap-1">
                      {selectedEmployee.skills.map((s, idx) => (
                        <span key={idx} className="text-[10px] bg-brand-500/10 text-brand-300 border border-brand-500/20 px-2.5 py-1 rounded-lg">
                          {s}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
