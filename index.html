    /* Shimmer Skeleton Loader */

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);

    // --- 3D TILT HOOK ---
    const use3DTilt = () => {
      const handlePointerMove = (e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
      };

      const handlePointerLeave = (e) => {
        const card = e.currentTarget;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return {
        onMouseMove: handlePointerMove,
        onMouseLeave: handlePointerLeave,
        onTouchMove: handlePointerMove,
        onTouchEnd: handlePointerLeave,
      };
    };

    // --- DYNAMIC SVG DONUT CHART ---
    function DepartmentDonutChart({ data }) {
      if (!data || data.length === 0) return null;
      const totalSpend = data.reduce((acc, d) => acc + d.spend, 0);
      const totalCount = data.reduce((acc, d) => acc + d.count, 0);

      const colors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
      let cumulativePercent = 0;

      const slices = data.map((d, i) => {
        const percent = totalSpend > 0 ? (d.spend / totalSpend) : 0;
        const start = cumulativePercent;
        cumulativePercent += percent;
        return {
          ...d,
          percent,
          start,
          color: colors[i % colors.length],
        };
      });

      return (
        <div className="flex flex-col sm:flex-row items-center justify-between gap-6">
          <div className="relative w-44 h-44 shrink-0 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
              {slices.map((s, idx) => {
                const strokeDasharray = `${s.percent * 251.2} 251.2`;
                const strokeDashoffset = `-${s.start * 251.2}`;
                return (
                  <circle
                    key={idx}
                    cx="50"
                    cy="50"
                    r="40"
                    fill="transparent"
                    stroke={s.color}
                    strokeWidth="12"
                    strokeDasharray={strokeDasharray}
                    strokeDashoffset={strokeDashoffset}
                    className="transition-all duration-500 hover:opacity-80"
                  />
                );
              })}
            </svg>
            <div className="absolute flex flex-col items-center justify-center pointer-events-none text-center">
              <span className="text-[10px] text-slate-400 font-mono uppercase">Total Nodes</span>
              <span className="text-xl font-black text-white">{totalCount}</span>
              <span className="text-[10px] text-emerald-400 font-bold">${Math.round(totalSpend / 1000)}k/yr</span>
            </div>
          </div>

          <div className="flex-1 space-y-2 text-xs w-full">
            {slices.map((s, idx) => (
              <div key={idx} className="flex items-center justify-between p-2 rounded-xl bg-slate-900/60 border border-slate-800">
                <div className="flex items-center space-x-2">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: s.color }}></span>
                  <span className="font-semibold text-slate-200 truncate">{s.department}</span>
                </div>
                <div className="flex items-center space-x-3 text-right font-mono">
                  <span className="text-slate-400">{s.count} members</span>
                  <span className="font-bold text-slate-200">{Math.round(s.percent * 100)}%</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      const tiltProps = use3DTilt();

      // State
      const [activeTab, setActiveTab] = useState('intelligence');
      const [dataSourceFilter, setDataSourceFilter] = useState('all'); // 'all' | 'real' | 'demo'
      const [employees, setEmployees] = useState([]);
      const [meta, setMeta] = useState({ total: 0, realVerifiedCount: 0, demoCount: 0 });
      const [analyticsStats, setAnalyticsStats] = useState(null);
      const [apiHealth, setApiHealth] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [apiError, setApiError] = useState(null);

      // Filters & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [deptFilter, setDeptFilter] = useState('ALL');
      const [riskFilter, setRiskFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('default');

      // Modals
      const [selectedEmployee, setSelectedEmployee] = useState(null);
      const [payslipEmployee, setPayslipEmployee] = useState(null);
      const [isAddEmployeeOpen, setIsAddEmployeeOpen] = useState(false);
      const [isApiHealthModalOpen, setIsApiHealthModalOpen] = useState(false);
      const [addFormErrors, setAddFormErrors] = useState([]);

      // Simulator State
      const [simEmpId, setSimEmpId] = useState('');
      const [simHike, setSimHike] = useState(12);
      const [simMode, setSimMode] = useState('HYBRID');
      const [simPromotion, setSimPromotion] = useState(true);
      const [simMentorship, setSimMentorship] = useState(true);

      // Toast Alert
      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Fetch Real Data from REST API
      const loadDataFromApi = async () => {
        setIsLoading(true);
        setApiError(null);
        try {
          // 1. Fetch Health
          const healthRes = await fetch('/api/v1/health');
          if (healthRes.ok) {
            const hData = await healthRes.json();
            setApiHealth(hData);
          }

          // 2. Fetch Employees
          const empRes = await fetch(`/api/v1/employees?source=${dataSourceFilter}&search=${encodeURIComponent(searchQuery)}&department=${encodeURIComponent(deptFilter)}&sort=${sortBy}`);
          if (!empRes.ok) throw new Error(`API Error: ${empRes.statusText}`);
          const empData = await empRes.json();
          setEmployees(empData.data || []);
          setMeta(empData.meta || { total: 0, realVerifiedCount: 0, demoCount: 0 });
          if (empData.data && empData.data.length > 0 && !simEmpId) {
            setSimEmpId(empData.data[0].id);
          }

          // 3. Fetch Analytics Stats
          const statsRes = await fetch('/api/v1/analytics/stats');
          if (statsRes.ok) {
            const sData = await statsRes.json();
            setAnalyticsStats(sData.stats);
          }
        } catch (err) {
          console.error("API Fetch Error:", err);
          setApiError(err.message || "Failed to connect to backend REST API.");
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        loadDataFromApi();
      }, [dataSourceFilter, deptFilter, sortBy]);

      // Debounced search
      useEffect(() => {
        const timer = setTimeout(() => {
          loadDataFromApi();
        }, 250);
        return () => clearTimeout(timer);
      }, [searchQuery]);

      // Handle Adding a REAL employee via API (POST /api/v1/employees)
      const handleCreateRealEmployee = async (e) => {
        e.preventDefault();
        setAddFormErrors([]);
        const fd = new FormData(e.target);

        const payload = {
          firstName: fd.get('firstName'),
          lastName: fd.get('lastName'),
          email: fd.get('email'),
          department: fd.get('department'),
          designation: fd.get('designation'),
          salary: Number(fd.get('salary')),
          workMode: fd.get('workMode'),
          location: fd.get('location'),
          skills: fd.get('skills'),
        };

        try {
          const res = await fetch('/api/v1/employees', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (!res.ok) {
            setAddFormErrors(result.details || [result.error || 'Failed to create employee.']);
            return;
          }

          showToast(`🟢 REAL EMPLOYEE CREATED: ${result.data.firstName} ${result.data.lastName} (${result.data.employeeCode}) stored in SQLite!`);
          setIsAddEmployeeOpen(false);
          loadDataFromApi();
        } catch (err) {
          setAddFormErrors([err.message || 'Network connection failed.']);
        }
      };

      // Handle Deleting Real Employee (DELETE /api/v1/employees/<id>)
      const handleDeleteEmployee = async (empId, empName) => {
        if (!confirm(`Are you sure you want to permanently delete ${empName} from the database?`)) return;
        try {
          const res = await fetch(`/api/v1/employees/${empId}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('Delete failed');
          showToast(`Employee ${empName} deleted from live database.`);
          loadDataFromApi();
        } catch (err) {
          showToast(`Error deleting employee: ${err.message}`);
        }
      };

      // Active target for simulator
      const activeSimEmp = useMemo(() => {
        return employees.find((e) => e.id === simEmpId) || employees[0];
      }, [employees, simEmpId]);

      const simulatedOutcome = useMemo(() => {
        if (!activeSimEmp) return { original: 50, simulated: 25, drop: 25 };
        const base = activeSimEmp.flightRisk.score;
        let delta = simHike * 2.1 + (simPromotion ? 16 : 0) + (simMentorship ? 8 : 0);
        if (simMode === 'HYBRID' || simMode === 'REMOTE') delta += 10;
        const finalScore = Math.max(8, Math.round(base - delta));
        return { original: base, simulated: finalScore, drop: base - finalScore };
      }, [activeSimEmp, simHike, simMode, simPromotion, simMentorship]);

      // Ambient Canvas Background
      useEffect(() => {
        const canvas = document.getElementById('ambient-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const particles = Array.from({ length: 50 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          radius: Math.random() * 2 + 1,
          color: Math.random() > 0.5 ? 'rgba(99, 102, 241,' : 'rgba(6, 182, 212,',
          alpha: Math.random() * 0.4 + 0.15,
        }));

        let animId;
        const render = () => {
          animId = requestAnimationFrame(render);
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.color} ${p.alpha})`;
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(99, 102, 241, ${(1 - dist / 110) * 0.12})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }
        };
        render();

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);

                  </div>

                  {isLoading ? (

                    </div>
                  ) : employees.length === 0 ? (

                                  🧪 DEMO
                                </span>
                              ) : (
                                <span className="text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-mono">
                                  🟢 LIVE DB
                                </span>
                              )}
                            </div>
                            <div className="mt-3">
                              <h3 className="font-bold text-sm text-white">{emp.firstName} {emp.lastName}</h3>
                              <p className="text-xs text-brand-300 font-medium">{emp.designation}</p>
                              <p className="text-[11px] text-slate-400 mt-0.5">{emp.department}</p>
                            </div>
                            <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                              <span>{emp.location.split(',')[0]}</span>
                              <span className="font-mono text-slate-200 font-bold">${(emp.salary.baseAnnual / 1000).toFixed(0)}k/yr</span>

                          </div>
                        </div>

                    </div>

              )}

              {/* TAB 3: PAYROLL */}
              {activeTab === 'payroll' && (

                      <h2 className="text-2xl font-black text-white">Payroll & Digital Payslips</h2>
                      <p className="text-slate-400 text-xs mt-1">Calculated directly from salary structures in database.</p>
                    </div>
                  </div>
                  <div {...tiltProps} className="card-tilt glass-panel-3d rounded-3xl p-6 border border-slate-800">
                    <div className="card-tilt-content overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="text-slate-400 border-b border-slate-800 font-semibold">
                            <th className="py-3 px-4">Provenance</th>
                            <th className="py-3 px-4">Employee</th>
                            <th className="py-3 px-4">Monthly Gross</th>

                            <th className="py-3 px-4 text-right">Digital Stub</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {employees.map((emp) => {
                            const gross = Math.round(emp.salary.baseAnnual / 12);
                            const net = Math.round(gross * 0.72);
                            return (
                              <tr key={emp.id} className="hover:bg-slate-800/40 transition">
                                <td className="py-3 px-4">
                                  {emp.isDemo ? (
                                    <span className="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400">🧪 Demo</span>
                                  ) : (
                                    <span className="px-2 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-300 font-bold font-mono">🟢 Live DB</span>
                                  )}
                                </td>
                                <td className="py-3.5 px-4 font-bold text-slate-200">
                                  {emp.firstName} {emp.lastName}
                                </td>
                                <td className="py-3.5 px-4 font-mono font-semibold">${gross.toLocaleString()}</td>
                                <td className="py-3.5 px-4 font-mono font-bold text-emerald-400">${net.toLocaleString()}</td>
                                <td className="py-3.5 px-4 text-right">
                                  <button
                                    onClick={() => setPayslipEmployee(emp)}
                                    className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold"

                                    View Payslip

                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: PERFORMANCE 9-BOX */}
              {activeTab === 'performance' && (
                <div className="space-y-6 animate-in fade-in duration-300">
                  <div>
                    <h2 className="text-2xl font-black text-white">Performance 9-Box Calibration Matrix</h2>
                    <p className="text-slate-400 text-xs mt-1">Calibrating potential vs delivery across all active database personnel.</p>
                  </div>
                  <div {...tiltProps} className="card-tilt glass-panel-3d p-6 rounded-3xl border border-slate-800">
                    <div className="card-tilt-content grid grid-cols-3 gap-3">
                      <div className="p-4 rounded-2xl bg-amber-950/30 border border-amber-800/40 min-h-[110px]">
                        <span className="text-[10px] font-bold text-amber-300 uppercase">Enigma / Diamond</span>
                        <div className="mt-2 text-xs text-slate-400">High Potential, Low Delivery</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-brand-950/40 border border-brand-800/40 min-h-[110px]">
                        <span className="text-[10px] font-bold text-brand-300 uppercase">Future Leader</span>
                        <div className="mt-2 text-xs text-slate-300">David Kim, Sarah Jenkins (Live DB)</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-emerald-950/40 border-2 border-emerald-500/50 shadow-glow-emerald min-h-[110px]">
                        <span className="text-[10px] font-bold text-emerald-300 uppercase">Star / Strategic Asset</span>
                        <div className="mt-2 text-xs font-bold text-white">Dr. Aaron Vance (Live DB), Elena Rostova</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 min-h-[110px]">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">Dilemma</span>
                        <div className="mt-2 text-xs text-slate-500">Requires targeted coaching</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 min-h-[110px]">

                        <div className="mt-2 text-xs text-slate-300">Marcus Vance, Sophia Chen</div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>

          {/* MODAL 1: ONBOARD REAL EMPLOYEE (SAVES TO LIVE SQLITE DATABASE) */}

            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

                </div>
                <p className="text-xs text-slate-400 mt-1">This record will be inserted directly into the SQLite database (`nexushr.db`).</p>

                      <input type="text" name="lastName" placeholder="e.g. Hayes" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none focus:border-emerald-500" required />

                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 font-semibold block mb-1">Annual Base Salary ($) *</label>
                      <input type="number" name="salary" defaultValue="155000" min="30000" step="1000" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" required />

                    <div>
                      <label className="text-slate-300 font-semibold block mb-1">Work Modality</label>

                        <option value="REMOTE">Remote</option>
                        <option value="IN_OFFICE">In-Office</option>
                      </select>

                    type="submit"
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:opacity-95 text-white font-bold text-xs uppercase tracking-wider shadow-glow-emerald transition mt-2"

                    Commit & Save Real Employee to Database

                </form>
              </div>

                <button
                  onClick={() => setIsApiHealthModalOpen(false)}

                  <Icon name="X" size={18} />

                <div className="flex items-center space-x-2 pb-3 border-b border-slate-800">
                  <Icon name="Database" size={18} className="text-brand-400" />

                </div>

                <div className="py-4 space-y-3 text-xs font-mono">
                  <div className="flex justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-slate-400">Database Engine:</span>
                    <span className="text-emerald-400 font-bold">{apiHealth?.database?.engine || 'SQLite 3'}</span>
                  </div>
                  <div className="flex justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-slate-400">Persistence File:</span>
                    <span className="text-slate-200">nexushr.db</span>
                  </div>
                  <div className="flex justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">

                    <span className="text-emerald-400 font-bold">{meta.realVerifiedCount}</span>

                  <div className="flex justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">

                    <span className="text-slate-300">{meta.demoCount}</span>
                  </div>
                  <div className="flex justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-slate-400">API Status:</span>
                    <span className="text-emerald-400 font-bold">{apiHealth?.status || 'UP'}</span>
                  </div>
                </div>

                <button
                  onClick={() => { loadDataFromApi(); setIsApiHealthModalOpen(false); }}

                  Refresh Live Connection

              </div>
            </div>

          {/* MODAL 3: DIGITAL PAYSLIP */}
          {payslipEmployee && (

                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-bold font-mono">🟢 Live Verified</span>

                <div className="py-4 space-y-2 text-xs">
                  <p className="font-bold text-white text-sm">{payslipEmployee.firstName} {payslipEmployee.lastName}</p>
                  <p className="text-slate-400 font-mono text-[10px]">{payslipEmployee.employeeCode} • {payslipEmployee.designation}</p>
                  <div className="flex justify-between pt-2">
                    <span className="text-slate-400">Monthly Gross</span>
                    <span className="font-mono text-white">${Math.round(payslipEmployee.salary.baseAnnual / 12).toLocaleString()}</span>

                  <div className="flex justify-between text-rose-300">
                    <span>Tax & PF Deductions (28%)</span>
                    <span className="font-mono">-${Math.round(payslipEmployee.salary.baseAnnual / 12 * 0.28).toLocaleString()}</span>

                  <div className="flex justify-between pt-2 border-t border-slate-800 text-sm font-bold text-emerald-400">
                    <span>Net Disbursed</span>
                    <span className="font-mono">${Math.round(payslipEmployee.salary.baseAnnual / 12 * 0.72).toLocaleString()}</span>
                  </div>
                </div>
                <div className="pt-4 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold flex items-center space-x-1.5"
                  >
                    <Icon name="Printer" size={14} />
                    <span>Print Stub</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: EMPLOYEE PROFILE */}
          {selectedEmployee && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#111827] border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl relative animate-in fade-in zoom-in-95">
                <button
                  onClick={() => setSelectedEmployee(null)}
                  className="absolute top-5 right-5 p-2 rounded-xl bg-slate-800 text-slate-300"
                >
                  <Icon name="X" size={18} />
                </button>
                <div className="flex items-center space-x-4 pb-4 border-b border-slate-800">
                  <img src={selectedEmployee.avatar} className="w-16 h-16 rounded-2xl object-cover border-2 border-brand-500" />
                  <div>
                    <div className="flex items-center space-x-2">
                      <h3 className="text-lg font-bold text-white">{selectedEmployee.firstName} {selectedEmployee.lastName}</h3>
                      {selectedEmployee.isDemo ? (
                        <span className="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-bold">🧪 Demo</span>
                      ) : (
                        <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-bold font-mono">🟢 Live DB</span>
                      )}
                    </div>
                    <p className="text-xs text-brand-300">{selectedEmployee.designation}</p>
                    <span className={`text-[10px] font-mono font-bold ${selectedEmployee.flightRisk.score > 60 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      Flight Risk: {selectedEmployee.flightRisk.score}% ({selectedEmployee.flightRisk.level})
                    </span>
                  </div>
                </div>
                <div className="py-4 space-y-2 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Department</span>
                    <span className="text-white font-medium">{selectedEmployee.department}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Work Modality</span>
                    <span className="text-white font-medium">{selectedEmployee.workMode}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Annual Base</span>
                    <span className="text-white font-mono font-bold">${selectedEmployee.salary.baseAnnual.toLocaleString()}</span>
                  </div>
                  <div className="pt-2">
                    <span className="text-slate-400 block mb-1.5">Core Competencies</span>
                    <div className="flex flex-wrap gap-1">
                      {selectedEmployee.skills.map((s, idx) => (
                        <span key={idx} className="text-[10px] bg-brand-500/10 text-brand-300 border border-brand-500/20 px-2.5 py-1 rounded-lg">
                          {s}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
